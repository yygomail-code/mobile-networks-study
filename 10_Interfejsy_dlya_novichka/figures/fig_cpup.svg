<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 690" width="1400" height="690" font-family="Segoe UI, Arial, sans-serif">
<defs>
<marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#33475b"/></marker>
<marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f4e79"/></marker>
<marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/></marker>
<marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e65100"/></marker>
<marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6a1b9a"/></marker>
<marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b71c1c"/></marker>
<marker id="mt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00796b"/></marker>
</defs>
<rect x="0" y="0" width="1400" height="690" fill="#ffffff"/>
<text x="700.0" y="44" font-size="26" font-weight="700" fill="#16212b" text-anchor="middle">Управление (C-plane) и данные (U-plane)</text>
<text x="700.0" y="78" font-size="14" fill="#556677" text-anchor="middle">Диагностика: сначала определяем, что сломано — установка услуги или передача данных</text>
<rect x="60" y="110" width="1280" height="230" rx="14" fill="#eef4fb" stroke="#c3d4e8" stroke-width="2"/>
<text x="80" y="145" font-size="16" fill="#1f4e79" font-weight="700" text-anchor="start">C-plane — управление: регистрация, установка сессий, политики, мобильность</text>
<rect x="100.0" y="208.0" width="140" height="54" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2"/><text x="170" y="240" font-size="15" fill="#16212b" font-weight="700" text-anchor="middle">UE</text>
<rect x="330.0" y="208.0" width="140" height="54" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2"/><text x="400" y="240" font-size="15" fill="#16212b" font-weight="700" text-anchor="middle">eNB</text>
<rect x="560.0" y="208.0" width="140" height="54" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2"/><text x="630" y="240" font-size="15" fill="#16212b" font-weight="700" text-anchor="middle">MME</text>
<rect x="790.0" y="208.0" width="140" height="54" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2"/><text x="860" y="240" font-size="15" fill="#16212b" font-weight="700" text-anchor="middle">HSS</text>
<rect x="560.0" y="288.0" width="140" height="54" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2"/><text x="630" y="320" font-size="15" fill="#16212b" font-weight="700" text-anchor="middle">SGW</text>
<path d="M 240 235 L 330 235" fill="none" stroke="#1f4e79" stroke-width="2.4" marker-end="url(#mb)" stroke-linecap="round"/>
<text x="285" y="220" font-size="12.5" fill="#1f4e79" font-weight="700" text-anchor="middle">Uu (RRC/NAS)</text>
<path d="M 470 235 L 560 235" fill="none" stroke="#1f4e79" stroke-width="2.4" marker-end="url(#mb)" stroke-linecap="round"/>
<text x="515" y="220" font-size="12.5" fill="#1f4e79" font-weight="700" text-anchor="middle">S1-MME</text>
<path d="M 700 235 L 790 235" fill="none" stroke="#1f4e79" stroke-width="2.4" marker-end="url(#mb)" stroke-linecap="round"/>
<text x="745" y="220" font-size="12.5" fill="#1f4e79" font-weight="700" text-anchor="middle">S6a</text>
<path d="M 630 262 L 630 288" fill="none" stroke="#1f4e79" stroke-width="2.4" marker-end="url(#mb)" stroke-linecap="round"/>
<text x="645" y="280" font-size="12.5" fill="#1f4e79" font-weight="700" text-anchor="start">S11</text>
<text x="1000" y="300" font-size="14" fill="#b71c1c" font-weight="700" text-anchor="start">C-plane сломан → услуга не устанавливается</text>
<rect x="60" y="370" width="1280" height="230" rx="14" fill="#eaf7ee" stroke="#c3e8cf" stroke-width="2"/>
<text x="80" y="405" font-size="16" fill="#2e7d32" font-weight="700" text-anchor="start">U-plane — данные: сам трафик абонента (интернет, голос, видео)</text>
<rect x="100.0" y="468.0" width="140" height="54" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2"/><text x="170" y="500" font-size="15" fill="#16212b" font-weight="700" text-anchor="middle">UE</text>
<rect x="330.0" y="468.0" width="140" height="54" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2"/><text x="400" y="500" font-size="15" fill="#16212b" font-weight="700" text-anchor="middle">eNB</text>
<rect x="560.0" y="468.0" width="140" height="54" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2"/><text x="630" y="500" font-size="15" fill="#16212b" font-weight="700" text-anchor="middle">SGW</text>
<rect x="790.0" y="468.0" width="140" height="54" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2"/><text x="860" y="500" font-size="15" fill="#16212b" font-weight="700" text-anchor="middle">PGW</text>
<rect x="1010.0" y="468.0" width="160" height="54" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2"/><text x="1090" y="500" font-size="15" fill="#16212b" font-weight="700" text-anchor="middle">Internet / PDN</text>
<path d="M 240 495 L 330 495" fill="none" stroke="#2e7d32" stroke-width="2.4" marker-end="url(#mg)" stroke-linecap="round"/>
<text x="285" y="480" font-size="12.5" fill="#2e7d32" font-weight="700" text-anchor="middle">Uu (DRB)</text>
<path d="M 470 495 L 560 495" fill="none" stroke="#2e7d32" stroke-width="2.4" marker-end="url(#mg)" stroke-linecap="round"/>
<text x="515" y="480" font-size="12.5" fill="#2e7d32" font-weight="700" text-anchor="middle">S1-U</text>
<path d="M 700 495 L 790 495" fill="none" stroke="#2e7d32" stroke-width="2.4" marker-end="url(#mg)" stroke-linecap="round"/>
<text x="745" y="480" font-size="12.5" fill="#2e7d32" font-weight="700" text-anchor="middle">S5/S8</text>
<path d="M 930 495 L 1010 495" fill="none" stroke="#2e7d32" stroke-width="2.4" marker-end="url(#mg)" stroke-linecap="round"/>
<text x="970" y="480" font-size="12.5" fill="#2e7d32" font-weight="700" text-anchor="middle">SGi</text>
<text x="1000" y="565" font-size="14" fill="#b71c1c" font-weight="700" text-anchor="start">U-plane сломан → сессия есть, данных нет</text>
<text x="700" y="660" font-size="13" fill="#556677" font-weight="normal" text-anchor="middle">C-plane: S1-MME, S11, S6a, Diameter. U-plane: S1-U, S5/S8, SGi (GTP-U).</text>
</svg>