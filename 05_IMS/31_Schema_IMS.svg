<rect x="0" y="0" width="2800" height="1650" fill="#ffffff"/>
<text x="1400.0" y="44" font-size="30" fill="#16212b" font-weight="700" text-anchor="middle">IMS: архитектура и интерфейсы</text>
<text x="1400.0" y="78" font-size="15" fill="#556677" font-weight="normal" text-anchor="middle">P-CSCF, I-CSCF, S-CSCF, HSS, серверы услуг, выход в PSTN и межсетевые стыки.</text>
<rect x="60" y="130" width="2680" height="1180" rx="14" fill="#f7f9fc" stroke="#c9d4e0" stroke-width="2"/>
<text x="1400" y="195" font-size="20" fill="#33475b" font-weight="700" text-anchor="middle">Архитектура IMS: узлы и интерфейсы</text>
<rect x="60" y="1350" width="2680" height="260" rx="14" fill="#eef4fb" stroke="#c3d4e8" stroke-width="2"/>
<text x="100" y="1405" font-size="18" fill="#1f4e79" font-weight="700" text-anchor="start">Что важно помнить</text>
<text x="100" y="1455" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• P-CSCF — первый контакт UE (регистрация, SIP-прокси, Rx/N5); I-CSCF — вход и выбор S-CSCF; S-CSCF — сессии и AS</text>
<text x="100" y="1495" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• AS: MMTel (услуги), SCC (непрерывность/SRVCC), IP-SM-GW (SMS); HSS — профиль (Cx/Sh)</text>
<text x="100" y="1535" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• Выход в PSTN: BGCF → MGCF/MGW; межсетевые стыки: IBCF/TrGW (Ici/Izi, штриховая линия)</text>
