<rect x="0" y="0" width="2800" height="1700" fill="#ffffff"/>
<text x="1400.0" y="44" font-size="30" fill="#16212b" font-weight="700" text-anchor="middle">VoLTE: сквозной путь установления</text>
<text x="1400.0" y="78" font-size="15" fill="#556677" font-weight="normal" text-anchor="middle">Слева — транспорт LTE (bearer QCI 1/5), справа — IMS (P-CSCF, S-CSCF, AS); в центре — политики QoS.</text>
<rect x="60" y="130" width="2680" height="1150" rx="14" fill="#f1f8f2" stroke="#c8e6c9" stroke-width="2"/>
<text x="1400" y="195" font-size="20" fill="#2e7d32" font-weight="700" text-anchor="middle">VoLTE end-to-end: от UE до IMS</text>
<rect x="60" y="1330" width="2680" height="320" rx="14" fill="#f7f9fc" stroke="#c9d4e0" stroke-width="2"/>
<text x="100" y="1385" font-size="18" fill="#33475b" font-weight="700" text-anchor="start">Путь установления вызова</text>
<text x="100" y="1435" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• INVITE (SDP) → P-CSCF → Rx/N5 → PCRF/PCF → Gx/N7 → PGW/UPF: bearer QCI 1 (GBR)</text>
<text x="100" y="1475" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• 183 Session Progress → PRACK/UPDATE → 180 Ringing → 200 OK → ACK → медиа RTP/SRTP</text>
<text x="100" y="1515" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• Сигнализация — QCI 5 (APN ims); голос — QCI 1; кодек EVS/AMR-WB; MOS ≥ 3,5; setup &lt; 2 с</text>
<text x="100" y="1555" font-size="14" fill="#b71c1c" font-weight="700" text-anchor="start">• Ошибки: нет правила Rx/Gx, TFT mismatch, jitter/loss, обрыв при переходе (SRVCC)</text>
