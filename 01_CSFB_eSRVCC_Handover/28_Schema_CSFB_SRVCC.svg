<text x="1460" y="565" font-size="15" fill="#16212b" font-weight="700" text-anchor="middle">UE</text>
<rect x="1625.0" y="534.0" width="150" height="52" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2.2"/>
<text x="1700" y="565" font-size="15" fill="#16212b" font-weight="700" text-anchor="middle">eNB</text>
