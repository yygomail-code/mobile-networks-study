<text x="1960" y="565" font-size="15" fill="#16212b" font-weight="700" text-anchor="middle">MME</text>
<rect x="2150.0" y="534.0" width="140" height="52" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2.2"/>
<text x="2220" y="565" font-size="15" fill="#16212b" font-weight="700" text-anchor="middle">MSC</text>
<rect x="2375.0" y="534.0" width="170" height="52" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2.2"/>
