<text x="434.0" y="647.76" font-size="12.5" fill="#e65100" font-weight="700" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round">SGs / Sv: CSFB, SRVCC</text>
<text x="777.3473886592968" y="654.186583921361" font-size="12.5" fill="#00796b" font-weight="700" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round">S3 / S4: PS HO</text>
