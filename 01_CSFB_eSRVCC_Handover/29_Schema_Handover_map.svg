<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2600 1500" width="2600" height="1500" font-family="Segoe UI, Arial, sans-serif">
<defs>
<marker id="arr-radio" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f4e79"/></marker>
<marker id="arr-user" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/></marker>
<marker id="arr-pol" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e65100"/></marker>
<marker id="arr-chg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6a1b9a"/></marker>
<marker id="arr-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00796b"/></marker>
<marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#546e7a"/></marker>
</defs>
<rect x="0" y="0" width="2600" height="1500" fill="#ffffff"/>
<text x="1300.0" y="44" font-size="30" fill="#16212b" font-weight="700" text-anchor="middle">Handover: полная карта переходов</text>
<text x="1300.0" y="78" font-size="15" fill="#556677" font-weight="normal" text-anchor="middle">Прямые (X2/Xn) и через ядро (S1/N2), межсистемные (N26, S3/S4) и голосовые (SGs/Sv).</text>
<rect x="40" y="150" width="2520" height="900" rx="14" fill="#f7f9fc" stroke="#c9d4e0" stroke-width="2"/>
<text x="1300" y="210" font-size="20" fill="#33475b" font-weight="700" text-anchor="middle">Карта Handover: LTE, 5G и межсистемные переходы</text>
<rect x="40" y="1120" width="2520" height="330" rx="14" fill="#eef4fb" stroke="#c3d4e8" stroke-width="2"/>
<text x="80" y="1180" font-size="18" fill="#1f4e79" font-weight="700" text-anchor="start">Виды и интерфейсы</text>
<text x="80" y="1235" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• Intra-LTE: X2 HO (прямой) и S1 HO (через MME); завершение — Path Switch к SGW</text>
<text x="80" y="1280" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• Intra-5G: Xn HO и N2 HO (через AMF); LTE↔5G — N26 (MME↔AMF), EPS fallback для голоса</text>
<text x="80" y="1325" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• LTE↔2G/3G: PS HO через S3/S4; голос — CSFB (SGs) и SRVCC (Sv)</text>
<text x="80" y="1375" font-size="14" fill="#b71c1c" font-weight="700" text-anchor="start">KPI: HO SR по типам • failure rate (too early / too late / wrong cell) • interruption time • ping-pong</text>
