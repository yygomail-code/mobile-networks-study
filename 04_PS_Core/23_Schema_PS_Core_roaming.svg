<rect x="0" y="0" width="2600" height="1500" fill="#ffffff"/>
<text x="1300.0" y="44" font-size="30" fill="#16212b" font-weight="700" text-anchor="middle">Роуминг в PS Core: home-routed и local breakout</text>
<text x="1300.0" y="78" font-size="15" fill="#556677" font-weight="normal" text-anchor="middle">Два сценария доставки данных в гостевой сети; сигнализация S6a — всегда в домашнюю сеть.</text>
<rect x="60" y="220" width="2480" height="480" rx="14" fill="#f2f7fd" stroke="#c3d4e8" stroke-width="2"/>
<text x="1300" y="270" font-size="20" fill="#1f4e79" font-weight="700" text-anchor="middle">Home-routed: PGW/UPF в домашней сети (HPLMN)</text>
<text x="710" y="300" font-size="12.5" fill="#e65100" font-weight="700" text-anchor="middle">S9: политики</text>
<rect x="60" y="740" width="2480" height="480" rx="14" fill="#f1f8f2" stroke="#c8e6c9" stroke-width="2"/>
<text x="1300" y="790" font-size="20" fill="#2e7d32" font-weight="700" text-anchor="middle">Local breakout: PGW/UPF в гостевой сети (VPLMN)</text>
<text x="1500" y="1080" font-size="13" fill="#556677" font-weight="normal" text-anchor="start">S6a всегда идёт в домашний HSS; PGW выбирается по APN-OI-Replacement</text>
<rect x="60" y="1240" width="2480" height="200" rx="14" fill="#f7f9fc" stroke="#c9d4e0" stroke-width="2"/>
<text x="100" y="1290" font-size="17" fill="#33475b" font-weight="700" text-anchor="start">Что важно в роуминге PS Core</text>
<text x="100" y="1335" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• Home-routed: данные через домашний PGW/UPF — домашние политики и тарификация; путь длиннее</text>
<text x="100" y="1375" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• Local breakout: PGW/UPF в гостевой сети — короткий путь; политики и тарифы — по договору операторов</text>
<text x="100" y="1415" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• Сигнализация: S6a — всегда в HPLMN (через DRA/IPX); защита стыков — DEA, GTP firewall, SEPP (5G)</text>
