<rect x="0" y="0" width="2700" height="1500" fill="#ffffff"/>
<text x="1350.0" y="44" font-size="30" fill="#16212b" font-weight="700" text-anchor="middle">PS Core: эволюция 2G/3G → EPC → 5GC</text>
<text x="1350.0" y="78" font-size="15" fill="#556677" font-weight="normal" text-anchor="middle">Узлы и интерфейсы трёх поколений ядра пакетной коммутации; внизу — что менялось.</text>
<rect x="40" y="150" width="840" height="870" rx="14" fill="#f2f7fd" stroke="#c3d4e8" stroke-width="2"/>
<text x="460" y="200" font-size="20" fill="#1f4e79" font-weight="700" text-anchor="middle">2G/3G: GPRS/UMTS</text>
<rect x="900" y="150" width="840" height="870" rx="14" fill="#f1f8f2" stroke="#c8e6c9" stroke-width="2"/>
<text x="1320" y="200" font-size="20" fill="#2e7d32" font-weight="700" text-anchor="middle">4G: EPC</text>
<rect x="1760" y="150" width="900" height="870" rx="14" fill="#fdf4e8" stroke="#e8d4b8" stroke-width="2"/>
<text x="2210" y="200" font-size="20" fill="#b26a00" font-weight="700" text-anchor="middle">5G: 5GC (SBA)</text>
<rect x="40" y="1100" width="2620" height="340" rx="14" fill="#f7f9fc" stroke="#c9d4e0" stroke-width="2"/>
<text x="80" y="1155" font-size="18" fill="#33475b" font-weight="700" text-anchor="start">Эволюция PS Core: что менялось</text>
<text x="80" y="1210" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• Сессии: PDP-контекст → EPS bearer → PDU-сессия с QoS flows</text>
<text x="80" y="1255" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• Узлы: SGSN/GGSN → MME/SGW/PGW → AMF/SMF/UPF; подписка: HLR → HSS → UDM</text>
<text x="80" y="1300" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• Управление: GTP-C → GTPv2-C → PFCP (N4); данные всегда в туннелях GTP-U</text>
<text x="80" y="1345" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• Разделение C/U: опция в EPC (CUPS) → основа 5GC; архитектура: монолит → SBA/CNF</text>
<text x="80" y="1390" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• Общее: Diameter (S6a/Gx/Gy), DNS-выбор узлов, роуминг через GRX/IPX, pool&#x27;ы и S1-Flex</text>
