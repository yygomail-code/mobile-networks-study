<rect x="0" y="0" width="1400" height="790" fill="#ffffff"/>
<text x="700.0" y="44" font-size="26" font-weight="700" fill="#16212b" text-anchor="middle">Пример: Attach в LTE — обмен S6a через DRA</text>
<text x="700.0" y="78" font-size="14" fill="#556677" text-anchor="middle">AIR/AIA — аутентификация; ULR/ULA — регистрация и подписка</text>
