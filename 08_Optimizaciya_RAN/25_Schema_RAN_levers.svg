<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2800 1700" width="2800" height="1700" font-family="Segoe UI, Arial, sans-serif">
<defs>
<marker id="arr-radio" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f4e79"/></marker>
<marker id="arr-user" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/></marker>
<marker id="arr-pol" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e65100"/></marker>
<marker id="arr-chg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6a1b9a"/></marker>
<marker id="arr-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00796b"/></marker>
<marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#546e7a"/></marker>
</defs>
<rect x="0" y="0" width="2800" height="1700" fill="#ffffff"/>
<text x="1400.0" y="44" font-size="30" fill="#16212b" font-weight="700" text-anchor="middle">Оптимизация RAN со стороны Core: карта рычагов</text>
<text x="1400.0" y="78" font-size="15" fill="#556677" font-weight="normal" text-anchor="middle">Восемь направлений влияния Core на радио-сеть и интерфейсы, через которые они работают.</text>
<rect x="60" y="150" width="2680" height="1180" rx="14" fill="#f7f9fc" stroke="#c9d4e0" stroke-width="2"/>
<text x="1400" y="210" font-size="20" fill="#33475b" font-weight="700" text-anchor="middle">Рычаги Core, влияющие на KPI RAN</text>
<rect x="60" y="1400" width="2680" height="260" rx="14" fill="#eef4fb" stroke="#c3d4e8" stroke-width="2"/>
<text x="100" y="1455" font-size="18" fill="#1f4e79" font-weight="700" text-anchor="start">Что важно помнить</text>
<text x="100" y="1505" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• Core не меняет радио-параметры (мощность, антенны, планировщик) — только политики, процедуры и транспорт</text>
<text x="100" y="1545" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• Изменения — по одному фактору, с guard-KPI, окном наблюдения и планом отката; согласуются с SON и RAN-командой</text>
<text x="100" y="1585" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• Доказательства: счётчики Core ↔ RAN-KPI ↔ QoE (MOS, скорость); трейсы, MDT, RCAF</text>
<path d="M 600 435 L 1400 755" fill="none" stroke="#1f4e79" stroke-width="2.6" marker-end="url(#arr-radio)" stroke-linecap="round"/>
<path d="M 1400 435 L 1400 755" fill="none" stroke="#1f4e79" stroke-width="2.6" marker-end="url(#arr-radio)" stroke-linecap="round"/>
<path d="M 2200 435 L 1400 755" fill="none" stroke="#1f4e79" stroke-width="2.6" marker-end="url(#arr-radio)" stroke-linecap="round"/>
<path d="M 600 820 L 1210 820" fill="none" stroke="#1f4e79" stroke-width="2.6" marker-end="url(#arr-radio)" stroke-linecap="round"/>
<path d="M 2200 820 L 1590 820" fill="none" stroke="#1f4e79" stroke-width="2.6" marker-end="url(#arr-radio)" stroke-linecap="round"/>
<path d="M 600 1205 L 1400 885" fill="none" stroke="#2e7d32" stroke-width="2.6" marker-end="url(#arr-user)" stroke-linecap="round"/>
<path d="M 1400 1205 L 1400 885" fill="none" stroke="#546e7a" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#arr-gray)" stroke-linecap="round"/>
<path d="M 2200 1205 L 1400 885" fill="none" stroke="#00796b" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#arr-sub)" stroke-linecap="round"/>
<rect x="1210.0" y="755.0" width="380" height="130" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2.2"/>
<text x="1400" y="814" font-size="14.5" fill="#16212b" font-weight="700" text-anchor="middle">RAN: eNB / gNB</text>
<text x="1400" y="836" font-size="11" fill="#5a6b7b" font-weight="normal" text-anchor="middle">планировщик · admission control · RRM</text>
<rect x="410.0" y="325.0" width="380" height="110" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2.2"/>
<text x="600" y="374" font-size="14.5" fill="#16212b" font-weight="700" text-anchor="middle">QoS и политики</text>
<text x="600" y="396" font-size="11" fill="#5a6b7b" font-weight="normal" text-anchor="middle">PCRF/PCF → Gx/N7; S1AP/NGAP: E-RAB QoS</text>
<rect x="1210.0" y="325.0" width="380" height="110" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2.2"/>
<text x="1400" y="374" font-size="14.5" fill="#16212b" font-weight="700" text-anchor="middle">Мобильность и RFSP</text>
<text x="1400" y="396" font-size="11" fill="#5a6b7b" font-weight="normal" text-anchor="middle">HSS/UDM, MME/AMF; S10/N26, пулы</text>
<rect x="2010.0" y="325.0" width="380" height="110" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2.2"/>
<text x="2200" y="374" font-size="14.5" fill="#16212b" font-weight="700" text-anchor="middle">Перегрузка и backoff</text>
<text x="2200" y="396" font-size="11" fill="#5a6b7b" font-weight="normal" text-anchor="middle">MME/AMF: Overload, NAS-таймеры</text>
<rect x="410.0" y="765.0" width="380" height="110" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2.2"/>
<text x="600" y="814" font-size="14.5" fill="#16212b" font-weight="700" text-anchor="middle">Голос: VoLTE / VoNR</text>
<text x="600" y="836" font-size="11" fill="#5a6b7b" font-weight="normal" text-anchor="middle">IMS → Rx → PCRF/PCF → Gx/N7</text>
<rect x="2010.0" y="765.0" width="380" height="110" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2.2"/>
<text x="2200" y="814" font-size="14.5" fill="#16212b" font-weight="700" text-anchor="middle">Paging и зоны</text>
<text x="2200" y="836" font-size="11" fill="#5a6b7b" font-weight="normal" text-anchor="middle">MME/AMF: TA list, DRX/eDRX</text>
<rect x="410.0" y="1205.0" width="380" height="110" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2.2"/>
<text x="600" y="1254" font-size="14.5" fill="#16212b" font-weight="700" text-anchor="middle">Транспорт</text>
<text x="600" y="1276" font-size="11" fill="#5a6b7b" font-weight="normal" text-anchor="middle">GTP-U, DSCP, MTU; SGW/UPF</text>
<rect x="1210.0" y="1205.0" width="380" height="110" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2.2"/>
<text x="1400" y="1254" font-size="14.5" fill="#16212b" font-weight="700" text-anchor="middle">Данные и SON</text>
<text x="1400" y="1276" font-size="11" fill="#5a6b7b" font-weight="normal" text-anchor="middle">PM, MDT, RCAF; SON-политики</text>
<rect x="2010.0" y="1205.0" width="380" height="110" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2.2"/>
<text x="2200" y="1254" font-size="14.5" fill="#16212b" font-weight="700" text-anchor="middle">IoT: eDRX / PSM</text>
<text x="2200" y="1276" font-size="11" fill="#5a6b7b" font-weight="normal" text-anchor="middle">MME/AMF: NAS-параметры</text>
<text x="930.0577491783343" y="584.2556270541642" font-size="12.5" fill="#1f4e79" font-weight="700" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round">QoS</text>
<text x="1384.0" y="569.4" font-size="12.5" fill="#1f4e79" font-weight="700" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round">RFSP</text>
<text x="1858.0577491783342" y="554.5443729458358" font-size="12.5" fill="#1f4e79" font-weight="700" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round">Overload</text>
<text x="856.2" y="836.0" font-size="12.5" fill="#1f4e79" font-weight="700" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round">QCI 1 / 5QI 1</text>
<text x="1943.8" y="804.0" font-size="12.5" fill="#1f4e79" font-weight="700" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round">Paging</text>
<text x="941.9422508216657" y="1085.455627054164" font-size="12.5" fill="#2e7d32" font-weight="700" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round">GTP-U</text>
<text x="1416.0" y="1070.6" font-size="12.5" fill="#546e7a" font-weight="700" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round">Измерения</text>
<text x="1869.9422508216658" y="1055.7443729458357" font-size="12.5" fill="#00796b" font-weight="700" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round">eDRX / PSM</text>
</svg>