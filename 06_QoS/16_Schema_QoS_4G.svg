<text x="900" y="666" font-size="11.5" fill="#5a6b7b" font-weight="normal" text-anchor="middle">транспорт bearer&#x27;ов</text>
<rect x="1175.0" y="620.0" width="150" height="60" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2.2"/>
