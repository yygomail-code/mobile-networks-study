<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 1400" width="2200" height="1400" font-family="Segoe UI, Arial, sans-serif">
<defs>
<marker id="arr-radio" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f4e79"/></marker>
<marker id="arr-user" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/></marker>
<marker id="arr-pol" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e65100"/></marker>
<marker id="arr-chg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6a1b9a"/></marker>
<marker id="arr-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00796b"/></marker>
<marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#546e7a"/></marker>
</defs>
<rect x="0" y="0" width="2200" height="1400" fill="#ffffff"/>
<text x="1100.0" y="44" font-size="30" fill="#16212b" font-weight="700" text-anchor="middle">QoS в 4G (EPS): bearer&#x27;ы, параметры и управление</text>
<text x="1100.0" y="78" font-size="15" fill="#556677" font-weight="normal" text-anchor="middle">Сквозной путь QoS: от политик PCRF до радио и UE. Цвет линии = зона ответственности.</text>
<rect x="60" y="1000" width="2080" height="340" rx="14" fill="#f7f9fc" stroke="#c9d4e0" stroke-width="2"/>
<text x="100" y="1055" font-size="18" fill="#33475b" font-weight="700" text-anchor="start">Где применяются параметры QoS</text>
<text x="100" y="1110" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• UE: TFT — классификация UL-трафика, QoS-правила</text>
<text x="100" y="1150" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• RAN (eNB): admission control, планировщик, DRB, вытеснение по ARP</text>
<text x="100" y="1190" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• Core: bearer&#x27;ы (default/dedicated), E-RAB QoS, enforcement, AMBR</text>
<text x="100" y="1230" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• PCRF/PCF: PCC-правила — QCI/5QI, GBR/MBR, ARP, flow-фильтры</text>
<text x="100" y="1275" font-size="14" fill="#1f4e79" font-weight="700" text-anchor="start">Ключевые параметры: QCI (1–9, 65–95) • ARP (1–15 + pre-emption) • GBR/MBR • APN-AMBR • UE-AMBR • TFT/SDF</text>
<text x="100" y="1310" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">Примеры: QCI 1 — голос • 5 — IMS-сигнализация • 9 — default • 65–70 — mission critical • 75 — V2X</text>
<path d="M 200 650 L 550 650" fill="none" stroke="#1f4e79" stroke-width="2.6" marker-end="url(#arr-radio)" stroke-linecap="round"/>
<path d="M 550 650 L 900 650" fill="none" stroke="#2e7d32" stroke-width="2.6" marker-end="url(#arr-user)" stroke-linecap="round"/>
