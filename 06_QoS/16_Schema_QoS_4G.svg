<text x="1450" y="246" font-size="14.5" fill="#16212b" font-weight="700" text-anchor="middle">AF (P-CSCF)</text>
<text x="1450" y="266" font-size="11.5" fill="#5a6b7b" font-weight="normal" text-anchor="middle">запрос медиа (VoLTE)</text>
<rect x="1775.0" y="220.0" width="150" height="60" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2.2"/>
