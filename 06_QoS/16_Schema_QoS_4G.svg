<text x="1850" y="266" font-size="11.5" fill="#5a6b7b" font-weight="normal" text-anchor="middle">тарификация, лимиты</text>
<text x="347.0" y="666.0" font-size="12.5" fill="#1f4e79" font-weight="700" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round">Uu: DRB (QCI, GBR)</text>
<text x="697.0" y="666.0" font-size="12.5" fill="#2e7d32" font-weight="700" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round">S1-U: GTP-U</text>
<text x="1047.0" y="666.0" font-size="12.5" fill="#2e7d32" font-weight="700" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round">S5/S8: bearer QoS</text>
<text x="1460.0" y="666.0" font-size="12.5" fill="#2e7d32" font-weight="700" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round">SGi (DSCP)</text>
<text x="607.5222800023253" y="485.8805700005813" font-size="12.5" fill="#1f4e79" font-weight="700" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round">S1-MME: E-RAB Setup (QCI, ARP, GBR/MBR)</text>
<text x="741.4320271359186" y="426.47998304005085" font-size="12.5" fill="#00796b" font-weight="700" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round">S11: Create/Modify Bearer (QoS)</text>
<text x="476.0" y="266.0" font-size="12.5" fill="#00796b" font-weight="700" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round">S6a: подписка</text>
<text x="1180.3108350559987" y="474.8445824720007" font-size="12.5" fill="#e65100" font-weight="700" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round">Gx: PCC-правила (QCI, GBR, ARP, AMBR)</text>
