<text x="610" y="268" font-size="13" fill="#e65100" font-weight="700" text-anchor="middle">Rx AAR: медиа, полосы, flow</text>
<path d="M 760 350 L 1060 350" fill="none" stroke="#e65100" stroke-width="2.4" marker-end="url(#mo)" stroke-linecap="round"/>
<text x="910" y="338" font-size="13" fill="#e65100" font-weight="700" text-anchor="middle">Gx CCA: Charging-Rule-Install (QCI 1, GBR)</text>
<path d="M 1060 420 L 1320 420" fill="none" stroke="#00796b" stroke-width="2.4" marker-end="url(#mt)" stroke-linecap="round"/>
<text x="1190" y="408" font-size="12.5" fill="#00796b" font-weight="700" text-anchor="middle">S11 → S1AP: Create Bearer / E-RAB Setup</text>
