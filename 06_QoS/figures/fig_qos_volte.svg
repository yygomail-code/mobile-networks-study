<text x="735" y="478" font-size="13" fill="#1f4e79" font-weight="700" text-anchor="middle">NAS: Activate Dedicated Bearer (QCI 1, TFT)</text>
<path d="M 150 570 L 1320 570" fill="none" stroke="#2e7d32" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#mg)" stroke-linecap="round"/>
<text x="735" y="558" font-size="13" fill="#2e7d32" font-weight="700" text-anchor="middle">Медиа RTP по bearer'у QCI 1 (GBR)</text>
<text x="700" y="660" font-size="13.5" fill="#556677" font-weight="normal" text-anchor="middle">Сигнализация IMS идёт по default bearer'у QCI 5 • При завершении вызова bearer освобождается</text>
<text x="700" y="700" font-size="13.5" fill="#b71c1c" font-weight="700" text-anchor="middle">Если цепочка обрывается (нет правила Rx/Gx, нет E-RAB) — голос без гарантий качества</text>
