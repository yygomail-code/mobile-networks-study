<text x="460" y="142" font-size="15" fill="#16212b" font-weight="700" text-anchor="middle">P-CSCF</text>
<path d="M 460 160 L 460 730" stroke="#c9d4e0" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="690" y="110" width="140" height="50" rx="10" fill="#f7f9fc" stroke="#c9d4e0" stroke-width="2"/>
<text x="760" y="142" font-size="15" fill="#16212b" font-weight="700" text-anchor="middle">PCRF</text>
<path d="M 760 160 L 760 730" stroke="#c9d4e0" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="990" y="110" width="140" height="50" rx="10" fill="#f7f9fc" stroke="#c9d4e0" stroke-width="2"/>
<text x="1060" y="142" font-size="15" fill="#16212b" font-weight="700" text-anchor="middle">PGW</text>
<path d="M 1060 160 L 1060 730" stroke="#c9d4e0" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="1250" y="110" width="140" height="50" rx="10" fill="#f7f9fc" stroke="#c9d4e0" stroke-width="2"/>
<text x="1320" y="142" font-size="15" fill="#16212b" font-weight="700" text-anchor="middle">eNB</text>
<path d="M 1320 160 L 1320 730" stroke="#c9d4e0" stroke-width="2" stroke-dasharray="7 6"/>
