</defs><rect x="0" y="0" width="1400" height="800" fill="#ffffff"/>
<text x="700.0" y="44" font-size="26" font-weight="700" fill="#16212b" text-anchor="middle">VoLTE: как создаётся bearer QCI 1</text>
<text x="700.0" y="78" font-size="14" fill="#556677" text-anchor="middle">Сквозная цепочка: SIP → Rx → Gx → S11 → S1AP → UE</text>
<rect x="80" y="110" width="140" height="50" rx="10" fill="#f7f9fc" stroke="#c9d4e0" stroke-width="2"/>
<text x="150" y="142" font-size="15" fill="#16212b" font-weight="700" text-anchor="middle">UE</text>
<path d="M 150 160 L 150 730" stroke="#c9d4e0" stroke-width="2" stroke-dasharray="7 6"/>
