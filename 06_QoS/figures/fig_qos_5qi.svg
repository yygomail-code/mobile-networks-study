</defs><rect x="0" y="0" width="1400" height="720" fill="#ffffff"/>
<text x="700.0" y="44" font-size="26" font-weight="700" fill="#16212b" text-anchor="middle">Классы 5QI: три типа ресурсов</text>
<text x="700.0" y="78" font-size="14" fill="#556677" text-anchor="middle">GBR — гарантия полосы; non-GBR — приоритеты; Delay-Critical GBR — жёсткие задержки</text>
<rect x="60" y="130" width="1280" height="150" rx="10" fill="#eaf7ee" stroke="#c3e8cf" stroke-width="2"/>
<text x="90" y="180" font-size="19" fill="#2e7d32" font-weight="700" text-anchor="start">GBR — гарантированная полоса</text>
<text x="90" y="225" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">PDB 50–300 мс • примеры: 1 голос, 2 видео-вызов, 3 игры/V2X, 4 стриминг, 65–70 mission critical, 75 V2X</text>
<rect x="60" y="310" width="1280" height="150" rx="10" fill="#eef4fb" stroke="#c3d4e8" stroke-width="2"/>
<text x="90" y="360" font-size="19" fill="#1f4e79" font-weight="700" text-anchor="start">non-GBR — без гарантий, но с приоритетами</text>
<text x="90" y="405" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">Приоритеты 10–90 • примеры: 5 IMS-сигнализация, 6/8 web и видео, 7 голос/игры, 9 default, 79/80 low latency eMBB</text>
<rect x="60" y="490" width="1280" height="150" rx="10" fill="#fdeeee" stroke="#e8c3c3" stroke-width="2"/>
<text x="90" y="540" font-size="19" fill="#b71c1c" font-weight="700" text-anchor="start">Delay-Critical GBR — URLLC</text>
<text x="90" y="585" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">PDB 5–30 мс, потери 10⁻⁴…10⁻⁵, MDBV • примеры: 82/83 автоматизация, 84 транспорт, 85 энергетика</text>
<text x="700" y="690" font-size="13" fill="#778899" font-weight="normal" text-anchor="middle">Полная таблица (MDBV, averaging window) — TS 23.501, табл. 5.7.4-1</text>
</svg>