</defs><rect x="0" y="0" width="1400" height="780" fill="#ffffff"/>
<text x="700.0" y="44" font-size="26" font-weight="700" fill="#16212b" text-anchor="middle">Bearer'ы в 4G: как трафик попадает в нужный канал</text>
<text x="700.0" y="78" font-size="14" fill="#556677" text-anchor="middle">TFT в UE классифицирует uplink; SDF-фильтры в PGW — downlink</text>
<rect x="60" y="220" width="200" height="120" rx="10" fill="#eef4fb" stroke="#c3d4e8" stroke-width="2"/>
<text x="160" y="265" font-size="16" fill="#1f4e79" font-weight="700" text-anchor="middle">Трафик UE</text>
<text x="160" y="295" font-size="13" fill="#556677" font-weight="normal" text-anchor="middle">голос (RTP) + web</text>
<rect x="360" y="220" width="260" height="120" rx="10" fill="#fdf4e8" stroke="#e8d4b8" stroke-width="2"/>
<text x="490" y="265" font-size="16" fill="#b26a00" font-weight="700" text-anchor="middle">TFT в UE</text>
<text x="490" y="295" font-size="12.5" fill="#556677" font-weight="normal" text-anchor="middle">фильтры 5-tuple + precedence</text>
<rect x="760" y="140" width="560" height="110" rx="10" fill="#eaf7ee" stroke="#c3e8cf" stroke-width="2"/>
<text x="1040" y="185" font-size="16" fill="#2e7d32" font-weight="700" text-anchor="middle">Dedicated bearer: QCI 1 (GBR)</text>
<text x="1040" y="215" font-size="13" fill="#556677" font-weight="normal" text-anchor="middle">фильтр RTP → голос идёт здесь</text>
<rect x="760" y="400" width="560" height="110" rx="10" fill="#f7f9fc" stroke="#c9d4e0" stroke-width="2"/>
<text x="1040" y="445" font-size="16" fill="#33475b" font-weight="700" text-anchor="middle">Default bearer: QCI 9 (non-GBR)</text>
<text x="1040" y="475" font-size="13" fill="#556677" font-weight="normal" text-anchor="middle">весь остальной трафик (web и др.)</text>
<path d="M 260 280 L 360 280" fill="none" stroke="#33475b" stroke-width="2.4" marker-end="url(#ma)" stroke-linecap="round"/>
<path d="M 620 250 L 760 200" fill="none" stroke="#2e7d32" stroke-width="2.4" marker-end="url(#mg)" stroke-linecap="round"/>
<text x="690" y="205" font-size="12.5" fill="#2e7d32" font-weight="700" text-anchor="middle">совпал фильтр</text>
<path d="M 620 310 L 760 440" fill="none" stroke="#33475b" stroke-width="2.4" marker-end="url(#ma)" stroke-linecap="round"/>
<text x="690" y="400" font-size="12.5" fill="#33475b" font-weight="700" text-anchor="middle">не совпал</text>
<path d="M 1040 250 L 1040 400" fill="none" stroke="#33475b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#ma)" stroke-linecap="round"/>
<text x="1055" y="330" font-size="12.5" fill="#556677" font-weight="normal" text-anchor="start">DL: SDF-фильтры из PCC</text>
<text x="700" y="700" font-size="14" fill="#556677" font-weight="normal" text-anchor="middle">Голос: QCI 1 + GBR + высокий ARP • Web: QCI 9 + APN-AMBR • Ошибка TFT → трафик уйдёт в default bearer</text>
