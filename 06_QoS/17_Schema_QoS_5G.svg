<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2200 1400" width="2200" height="1400" font-family="Segoe UI, Arial, sans-serif">
<defs>
<marker id="arr-radio" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f4e79"/></marker>
<marker id="arr-user" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/></marker>
<marker id="arr-pol" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e65100"/></marker>
<marker id="arr-chg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6a1b9a"/></marker>
<marker id="arr-sub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00796b"/></marker>
<marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#546e7a"/></marker>
</defs>
<rect x="0" y="0" width="2200" height="1400" fill="#ffffff"/>
<text x="1100.0" y="44" font-size="30" fill="#16212b" font-weight="700" text-anchor="middle">QoS в 5G: PDU-сессия, QoS flows и управление</text>
<text x="1100.0" y="78" font-size="15" fill="#556677" font-weight="normal" text-anchor="middle">Класс 5QI, идентификатор QFI, правила QoS и SDAP; политики — PCF, исполнение — UPF.</text>
<rect x="60" y="1030" width="2080" height="330" rx="14" fill="#f7f9fc" stroke="#c9d4e0" stroke-width="2"/>
<text x="100" y="1085" font-size="18" fill="#33475b" font-weight="700" text-anchor="start">5G QoS: ключевые понятия</text>
<text x="100" y="1140" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• PDU-сессия → QoS flows (QFI); класс — 5QI, приоритет — ARP</text>
<text x="100" y="1180" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• QoS rules в UE (QRI, фильтры); SDAP маппит QoS flow → DRB</text>
<text x="100" y="1220" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• GBR / non-GBR / Delay-Critical GBR; session-AMBR; MDBV, averaging window</text>
<text x="100" y="1260" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• Reflective QoS (RQI); QNC + Alternative QoS Profiles; 5QI↔QCI при переходах</text>
<text x="100" y="1305" font-size="14" fill="#6a1b9a" font-weight="700" text-anchor="start">Примеры 5QI: 1 — голос • 5 — IMS • 9 — default • 79/80 — low latency eMBB • 82–85 — URLLC</text>
