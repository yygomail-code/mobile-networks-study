<text x="789.0" y="696.0" font-size="12.5" fill="#2e7d32" font-weight="700" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round">N3: GTP-U (QFI)</text>
<text x="1281.0" y="696.0" font-size="12.5" fill="#2e7d32" font-weight="700" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round">N6</text>
<text x="678.1072029031325" y="504.66995450109266" font-size="12.5" fill="#1f4e79" font-weight="700" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round">N2 (NGAP): PDU Session Resource Setup (5QI, QFI)</text>
<text x="800.2" y="343.6" font-size="12.5" fill="#00796b" font-weight="700" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round">N11: управление сессией</text>
<text x="949.5982304505822" y="555.3402844887507" font-size="12.5" fill="#00796b" font-weight="700" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round">N4 (PFCP): QoS flow, session-AMBR</text>
<text x="1014.9951207608708" y="378.4939009510885" font-size="12.5" fill="#e65100" font-weight="700" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round">N7: PCC (5QI, ARP, AMBR)</text>
