<text x="1320" y="378" font-size="16" fill="#16212b" text-anchor="middle">L2/L1</text>
<text x="1660" y="140" font-size="15" font-weight="700" fill="#6a1b9a" text-anchor="middle">N2 (NGAP)</text>
<rect x="1510" y="170" width="300" height="52" rx="6" fill="#ffffff" stroke="#6a1b9a" stroke-width="1.8"/>
<text x="1660" y="204" font-size="16" fill="#16212b" text-anchor="middle">NGAP</text>
<rect x="1510" y="228" width="300" height="52" rx="6" fill="#f4f7fa" stroke="#6a1b9a" stroke-width="1.8"/>
<text x="1660" y="262" font-size="16" fill="#16212b" text-anchor="middle">SCTP</text>
<rect x="1510" y="286" width="300" height="52" rx="6" fill="#ffffff" stroke="#6a1b9a" stroke-width="1.8"/>
<text x="1660" y="320" font-size="16" fill="#16212b" text-anchor="middle">IP</text>
<rect x="1510" y="344" width="300" height="52" rx="6" fill="#f4f7fa" stroke="#6a1b9a" stroke-width="1.8"/>
<text x="1660" y="378" font-size="16" fill="#16212b" text-anchor="middle">L2/L1</text>
<text x="2000" y="140" font-size="15" font-weight="700" fill="#546e7a" text-anchor="middle">N4 (PFCP)</text>
<rect x="1850" y="170" width="300" height="52" rx="6" fill="#ffffff" stroke="#546e7a" stroke-width="1.8"/>
