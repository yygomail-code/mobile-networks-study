<rect x="0" y="0" width="2800" height="1600" fill="#ffffff"/>
<text x="1400.0" y="44" font-size="30" fill="#16212b" font-weight="700" text-anchor="middle">Траблшутинг: лестница диагностики и дерево проверок</text>
<text x="1400.0" y="78" font-size="15" fill="#556677" font-weight="normal" text-anchor="middle">Слева — путь по слоям, справа — последовательность первых проверок до точки отказа.</text>
<rect x="60" y="130" width="1140" height="1060" rx="14" fill="#f2f7fd" stroke="#c3d4e8" stroke-width="2"/>
<text x="630" y="195" font-size="20" fill="#1f4e79" font-weight="700" text-anchor="middle">Лестница диагностики</text>
<rect x="1260" y="130" width="1480" height="1060" rx="14" fill="#f1f8f2" stroke="#c8e6c9" stroke-width="2"/>
<text x="2000" y="195" font-size="20" fill="#2e7d32" font-weight="700" text-anchor="middle">Дерево первых проверок</text>
<text x="2000" y="1180" font-size="15" fill="#2e7d32" font-weight="700" text-anchor="middle">Найдено первое расхождение — это точка отказа</text>
<rect x="60" y="1240" width="2680" height="300" rx="14" fill="#f7f9fc" stroke="#c9d4e0" stroke-width="2"/>
<text x="100" y="1295" font-size="18" fill="#33475b" font-weight="700" text-anchor="start">Правила разбора</text>
<text x="100" y="1345" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• Сначала данные (счётчики, трейсы, конфиг), потом действия; один фактор за раз</text>
<text x="100" y="1385" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• Классификация: сеть / конфигурация / нагрузка / софт / железо / внешняя система</text>
<text x="100" y="1425" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• Проверять обе стороны стыка и оба направления (UL/DL); фиксировать результат</text>
<path d="M 600 355 L 600 465" fill="none" stroke="#546e7a" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#arr-gray)" stroke-linecap="round"/>
<path d="M 600 575 L 600 685" fill="none" stroke="#546e7a" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#arr-gray)" stroke-linecap="round"/>
<path d="M 600 795 L 600 905" fill="none" stroke="#546e7a" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#arr-gray)" stroke-linecap="round"/>
<path d="M 1900 305 L 1900 375" fill="none" stroke="#546e7a" stroke-width="2.6" marker-end="url(#arr-gray)" stroke-linecap="round"/>
<path d="M 1900 465 L 1900 535" fill="none" stroke="#546e7a" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#arr-gray)" stroke-linecap="round"/>
<path d="M 1900 625 L 1900 695" fill="none" stroke="#546e7a" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#arr-gray)" stroke-linecap="round"/>
<path d="M 1900 785 L 1900 855" fill="none" stroke="#546e7a" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#arr-gray)" stroke-linecap="round"/>
<path d="M 1900 945 L 1900 1015" fill="none" stroke="#546e7a" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#arr-gray)" stroke-linecap="round"/>
<rect x="280.0" y="245.0" width="640" height="110" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2.2"/>
<text x="600" y="294" font-size="14.5" fill="#16212b" font-weight="700" text-anchor="middle">1. UE и радио</text>
<text x="600" y="316" font-size="11" fill="#5a6b7b" font-weight="normal" text-anchor="middle">RRC/NAS: reject cause, RSRP/SINR, состояния</text>
<rect x="280.0" y="465.0" width="640" height="110" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2.2"/>
<text x="600" y="514" font-size="14.5" fill="#16212b" font-weight="700" text-anchor="middle">2. Транспорт</text>
<text x="600" y="536" font-size="11" fill="#5a6b7b" font-weight="normal" text-anchor="middle">GTP-U: потери, MTU, DSCP, ретрансмиссии</text>
<rect x="280.0" y="685.0" width="640" height="110" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2.2"/>
<text x="600" y="734" font-size="14.5" fill="#16212b" font-weight="700" text-anchor="middle">3. Core</text>
<text x="600" y="756" font-size="11" fill="#5a6b7b" font-weight="normal" text-anchor="middle">S1AP cause, S6a Result-Code, S11/S5 Cause IE</text>
<rect x="280.0" y="905.0" width="640" height="110" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2.2"/>
<text x="600" y="954" font-size="14.5" fill="#16212b" font-weight="700" text-anchor="middle">4. Сервис</text>
<text x="600" y="976" font-size="11" fill="#5a6b7b" font-weight="normal" text-anchor="middle">IMS/SIP-коды, APN/DNN, политики, DNS</text>
<rect x="1590.0" y="215.0" width="620" height="90" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2.2"/>
<text x="1900" y="254" font-size="14.5" fill="#16212b" font-weight="700" text-anchor="middle">Симптом</text>
<text x="1900" y="276" font-size="11" fill="#5a6b7b" font-weight="normal" text-anchor="middle">точное описание и время</text>
<rect x="1590.0" y="375.0" width="620" height="90" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2.2"/>
<text x="1900" y="414" font-size="14.5" fill="#16212b" font-weight="700" text-anchor="middle">RRC reject?</text>
<text x="1900" y="436" font-size="11" fill="#5a6b7b" font-weight="normal" text-anchor="middle">проверить RAN: overload, barring</text>
<rect x="1590.0" y="535.0" width="620" height="90" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2.2"/>
<text x="1900" y="574" font-size="14.5" fill="#16212b" font-weight="700" text-anchor="middle">S1AP/NGAP cause?</text>
<text x="1900" y="596" font-size="11" fill="#5a6b7b" font-weight="normal" text-anchor="middle">radio / transport / overload</text>
<rect x="1590.0" y="695.0" width="620" height="90" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2.2"/>
<text x="1900" y="734" font-size="14.5" fill="#16212b" font-weight="700" text-anchor="middle">S6a Result-Code?</text>
<text x="1900" y="756" font-size="11" fill="#5a6b7b" font-weight="normal" text-anchor="middle">подписка / маршрут / DRA</text>
<rect x="1590.0" y="855.0" width="620" height="90" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2.2"/>
<text x="1900" y="894" font-size="14.5" fill="#16212b" font-weight="700" text-anchor="middle">S11 / S5 Cause?</text>
<text x="1900" y="916" font-size="11" fill="#5a6b7b" font-weight="normal" text-anchor="middle">ресурсы / APN / DNS</text>
<rect x="1590.0" y="1015.0" width="620" height="90" rx="10" fill="#ffffff" stroke="#33475b" stroke-width="2.2"/>
<text x="1900" y="1054" font-size="14.5" fill="#16212b" font-weight="700" text-anchor="middle">Gx/QoS и SGi?</text>
<text x="1900" y="1076" font-size="11" fill="#5a6b7b" font-weight="normal" text-anchor="middle">политика / транспорт / сервис</text>
<text x="584.0" y="401.2" font-size="12.5" fill="#546e7a" font-weight="700" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round">вниз по пути</text>
<text x="1884.0" y="494.4" font-size="12.5" fill="#546e7a" font-weight="700" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round">нет</text>
<text x="1884.0" y="654.4" font-size="12.5" fill="#546e7a" font-weight="700" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round">нет</text>
<text x="1884.0" y="814.4" font-size="12.5" fill="#546e7a" font-weight="700" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round">нет</text>
<text x="1884.0" y="974.4" font-size="12.5" fill="#546e7a" font-weight="700" text-anchor="middle" style="paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round">нет</text>
</svg>