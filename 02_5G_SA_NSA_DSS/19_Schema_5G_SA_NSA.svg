<rect x="0" y="0" width="2400" height="1500" fill="#ffffff"/>
<text x="1200.0" y="44" font-size="30" fill="#16212b" font-weight="700" text-anchor="middle">5G: NSA (EN-DC) и SA — архитектуры и интерфейсы</text>
<text x="1200.0" y="78" font-size="15" fill="#556677" font-weight="normal" text-anchor="middle">Слева — неавтономный 5G на якоре LTE и EPC; справа — автономный 5G: NR и сервисное ядро 5GC.</text>
<rect x="50" y="150" width="1150" height="900" rx="14" fill="#f2f7fd" stroke="#c3d4e8" stroke-width="2"/>
<text x="625" y="200" font-size="20" fill="#1f4e79" font-weight="700" text-anchor="middle">NSA (EN-DC, Option 3x): якорь LTE — ядро EPC</text>
<rect x="1250" y="150" width="1100" height="900" rx="14" fill="#f1f8f2" stroke="#c8e6c9" stroke-width="2"/>
<text x="1800" y="200" font-size="20" fill="#2e7d32" font-weight="700" text-anchor="middle">SA (Option 2): NR + 5GC (SBA)</text>
<rect x="50" y="1120" width="2300" height="300" rx="14" fill="#f7f9fc" stroke="#c9d4e0" stroke-width="2"/>
<text x="100" y="1175" font-size="18" fill="#33475b" font-weight="700" text-anchor="start">Ключевые отличия и переходы</text>
<text x="100" y="1230" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• NSA: якорь LTE, ядро EPC, голос VoLTE, быстрый запуск; слайсинг и VoNR недоступны</text>
<text x="100" y="1275" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• SA: NR + 5GC (SBA): слайсинг (S-NSSAI), URLLC, MEC, VoNR / EPS fallback</text>
<text x="100" y="1320" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• Переходы: N26 (AMF↔MME), Xn/N2 handover, Option 7x (LTE-якорь + 5GC)</text>
<text x="100" y="1365" font-size="14" fill="#556677" font-weight="normal" text-anchor="start">• DSS: LTE и NR в одной несущей; NR обходит CRS, SSB — в MBSFN-субкадрах LTE</text>
