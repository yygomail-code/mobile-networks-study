<text x="88" y="358" font-size="18" font-weight="700" fill="#1f4e79" text-anchor="end">LTE</text>
<text x="88" y="518" font-size="18" font-weight="700" fill="#2e7d32" text-anchor="end">NR</text>
<path d="M 430 610 L 430 415" fill="none" stroke="#546e7a" stroke-width="2.2" marker-end="url(#a1)"/>
<text x="450" y="612" font-size="14" fill="#546e7a" text-anchor="start">CRS LTE: NR делает rate matching вокруг опорных сигналов</text>
<path d="M 1090 610 L 1090 575" fill="none" stroke="#546e7a" stroke-width="2.2" marker-end="url(#a1)"/>
<text x="1110" y="612" font-size="14" fill="#546e7a" text-anchor="start">SSB NR передаётся в MBSFN-субкадрах LTE</text>
<text x="450" y="662" font-size="14" fill="#546e7a" text-anchor="start">Планировщик отдаёт NR только свободные ресурсы — динамически, по слотам</text>
<rect x="100" y="700" width="2200" height="60" rx="10" fill="#ffffff" stroke="#e0e6ee" stroke-width="1.5"/>
<rect x="160" y="716" width="30" height="28" rx="5" fill="#dbe9f7" stroke="#9fb8d4" stroke-width="1.5"/>
<text x="200" y="737" font-size="14" fill="#556677" text-anchor="start">LTE данные</text>
<rect x="350" y="716" width="30" height="28" rx="5" fill="#c62828" stroke="#c62828" stroke-width="1.5"/>
<text x="390" y="737" font-size="14" fill="#556677" text-anchor="start">LTE CRS</text>
<rect x="513" y="716" width="30" height="28" rx="5" fill="#c8e6c9" stroke="#66bb6a" stroke-width="1.5"/>
<text x="553" y="737" font-size="14" fill="#556677" text-anchor="start">NR данные</text>
<rect x="694" y="716" width="30" height="28" rx="5" fill="#e1d5f5" stroke="#9575cd" stroke-width="1.5"/>
<text x="734" y="737" font-size="14" fill="#556677" text-anchor="start">NR SSB</text>
<rect x="100" y="790" width="2200" height="520" rx="14" fill="#f7f9fc" stroke="#c9d4e0" stroke-width="2"/>
<text x="140" y="845" font-size="18" font-weight="700" fill="#33475b" text-anchor="start">Как работает DSS и что важно</text>
<text x="140" y="905" font-size="15" fill="#556677" text-anchor="start">• Нумерология NR выравнивается с LTE: SCS 15 кГц, совместимая сетка ресурсных блоков</text>
<text x="140" y="953" font-size="15" fill="#556677" text-anchor="start">• NR обходит LTE CRS (rate matching); SSB NR — в MBSFN-субкадрах LTE</text>
<text x="140" y="1001" font-size="15" fill="#556677" text-anchor="start">• Ресурсы делятся по слотам динамически; нужна быстрая координация планировщиков</text>
<text x="140" y="1049" font-size="15" fill="#556677" text-anchor="start">• Плюсы: быстрое покрытие 5G без нового спектра, плавная миграция, один слой оборудования</text>
<text x="140" y="1097" font-size="15" fill="#556677" text-anchor="start">• Минусы: потеря ёмкости, ниже пиковые скорости NR, часть функций NR недоступна</text>
<text x="140" y="1145" font-size="15" fill="#556677" text-anchor="start">• KPI: следить за просадкой LTE, PRB utilization и долей ресурсов NR</text>
</svg>