</defs><rect x="0" y="0" width="1500" height="820" fill="#ffffff"/>
<text x="750.0" y="44" font-size="26" font-weight="700" fill="#16212b" text-anchor="middle">EPS Fallback: голос из 5G в LTE</text>
<text x="750.0" y="78" font-size="14" fill="#556677" text-anchor="middle">Если VoNR недоступен, вызов переводится в LTE до установления соединения</text>
