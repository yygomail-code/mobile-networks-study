<text x="750" y="640" font-size="13.5" fill="#556677" font-weight="normal" text-anchor="middle">После завершения вызова UE может вернуться в NR (по покрытию и политике)</text>
<text x="750" y="680" font-size="13.5" fill="#2e7d32" font-weight="700" text-anchor="middle">VoNR (когда доступен) — голос как QoS flow 5QI 1 прямо в NR</text>
