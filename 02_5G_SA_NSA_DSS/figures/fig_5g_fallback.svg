<text x="1370" y="141" font-size="14" fill="#16212b" font-weight="700" text-anchor="middle">IMS</text>
<path d="M 1370 158 L 1370 750" stroke="#c9d4e0" stroke-width="2" stroke-dasharray="7 6"/>
