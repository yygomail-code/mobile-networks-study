</defs><rect x="0" y="0" width="1500" height="760" fill="#ffffff"/>
<text x="750.0" y="44" font-size="26" font-weight="700" fill="#16212b" text-anchor="middle">Правила и приоритеты: как трафик попадает в канал</text>
<text x="750.0" y="78" font-size="14" fill="#556677" text-anchor="middle">Precedence важен: первое совпавшее правило выигрывает</text>
<rect x="100" y="300" width="200" height="100" rx="10" fill="#eef4fb" stroke="#c3d4e8" stroke-width="2"/>
<text x="200" y="340" font-size="16" fill="#1f4e79" font-weight="700" text-anchor="middle">Трафик UE</text>
<text x="200" y="370" font-size="13" fill="#556677" font-weight="normal" text-anchor="middle">RTP, SIP, web</text>
<rect x="400" y="190" width="460" height="90" rx="10" fill="#eaf7ee" stroke="#c3e8cf" stroke-width="2"/>
<text x="630" y="242" font-size="15" fill="#2e7d32" font-weight="700" text-anchor="middle">Правило 1: RTP → bearer QCI 1</text>
<rect x="400" y="320" width="460" height="90" rx="10" fill="#eef4fb" stroke="#c3d4e8" stroke-width="2"/>
<text x="630" y="372" font-size="15" fill="#1f4e79" font-weight="700" text-anchor="middle">Правило 2: SIP → QCI 5</text>
