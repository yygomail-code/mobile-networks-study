<text x="630" y="502" font-size="15" fill="#33475b" font-weight="700" text-anchor="middle">Правило 3: any → default (QCI 9)</text>
<path d="M 300 330 L 400 240" fill="none" stroke="#2e7d32" stroke-width="2.4" marker-end="url(#mg)" stroke-linecap="round"/>
<path d="M 300 350 L 400 360" fill="none" stroke="#1f4e79" stroke-width="2.4" marker-end="url(#mb)" stroke-linecap="round"/>
<path d="M 300 380 L 400 480" fill="none" stroke="#33475b" stroke-width="2.4" marker-end="url(#ma)" stroke-linecap="round"/>
<rect x="950" y="240" width="420" height="300" rx="10" fill="#ffffff" stroke="#e0e6ee" stroke-width="1.5"/>
<text x="1160" y="290" font-size="15" fill="#33475b" font-weight="700" text-anchor="middle">Каналы (bearer'ы)</text>
<text x="1160" y="330" font-size="13" fill="#2e7d32" font-weight="normal" text-anchor="middle">QCI 1 — голос (GBR)</text>
<text x="1160" y="365" font-size="13" fill="#1f4e79" font-weight="normal" text-anchor="middle">QCI 5 — сигнализация</text>
<text x="1160" y="400" font-size="13" fill="#33475b" font-weight="normal" text-anchor="middle">QCI 9 — default</text>
<text x="1160" y="435" font-size="13" fill="#556677" font-weight="normal" text-anchor="middle">precedence решает</text>
<path d="M 860 235 L 950 300" fill="none" stroke="#2e7d32" stroke-width="2.4" marker-end="url(#mg)" stroke-linecap="round"/>
<path d="M 860 365 L 950 365" fill="none" stroke="#1f4e79" stroke-width="2.4" marker-end="url(#mb)" stroke-linecap="round"/>
<path d="M 860 495 L 950 430" fill="none" stroke="#33475b" stroke-width="2.4" marker-end="url(#ma)" stroke-linecap="round"/>
<text x="750" y="660" font-size="14" fill="#b71c1c" font-weight="700" text-anchor="middle">Ошибка фильтра → трафик уйдёт в default (скорость/приоритет не те)</text>
